# Deploys main to your server over SSH after the tests pass, then records the deploy
# so the site's footer and /status page show it.
#
# Off by default. To turn it on, add in the repository settings:
#   Variables: DEPLOY_ENABLED = true
#   Secrets:   DEPLOY_HOST, DEPLOY_USER, DEPLOY_PATH (the checkout on the server),
#              DEPLOY_SSH_KEY (private key), DEPLOY_KNOWN_HOSTS (output of `ssh-keyscan your-host`)
# The server needs git and Docker; it runs ./deploy.sh from the checkout.

name: Deploy

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    if: vars.DEPLOY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" "cd '${{ secrets.DEPLOY_PATH }}' && ./deploy.sh"
